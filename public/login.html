<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — SiteObfusque</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #05050c;
    --glass: rgba(255,255,255,0.04);
    --glass-border: rgba(255,255,255,0.08);
    --text: #f5f5fa;
    --text-dim: #8b8b9e;
  }
  html, body { height: 100%; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); overflow: hidden; }
  body::before {
    content: ''; position: fixed; inset: 0;
    background:
      radial-gradient(circle at 20% 30%, rgba(124,58,237,0.35) 0%, transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(6,182,212,0.3) 0%, transparent 40%);
    z-index: -2; animation: aurora 20s ease-in-out infinite alternate;
  }
  @keyframes aurora {
    0% { transform: scale(1); }
    100% { transform: scale(1.15) translate(3%, -3%); }
  }

  .wrapper {
    height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .card {
    width: 100%; max-width: 440px;
    background: var(--glass); border: 1px solid var(--glass-border);
    border-radius: 28px; backdrop-filter: blur(30px) saturate(180%);
    padding: 44px 40px; position: relative; overflow: hidden;
    animation: fadeUp 0.6s ease both;
  }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  .card::before {
    content: ''; position: absolute; top: 0; left: -50%; width: 200%; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
    animation: shimmer 3s infinite;
  }
  @keyframes shimmer { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }

  .logo {
    font-weight: 900; font-size: 26px; letter-spacing: -0.5px; margin-bottom: 6px;
    background: linear-gradient(135deg, #7c3aed 0%, #06b6d4 50%, #ec4899 100%);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    background-size: 200% 200%; animation: shine 4s ease infinite;
  }
  @keyframes shine { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
  .subtitle { color: var(--text-dim); font-size: 14px; margin-bottom: 32px; }

  .tabs {
    display: flex; gap: 8px; margin-bottom: 24px;
    background: rgba(0,0,0,0.3); padding: 6px; border-radius: 14px;
  }
  .tab {
    flex: 1; padding: 10px; text-align: center; border-radius: 10px;
    font-size: 14px; font-weight: 600; color: var(--text-dim);
    cursor: pointer; transition: all 0.3s;
  }
  .tab.active {
    background: linear-gradient(135deg, #7c3aed, #06b6d4);
    color: white;
  }

  .form-group { margin-bottom: 18px; }
  label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 8px; color: var(--text-dim); }
  input {
    width: 100%; padding: 14px 18px;
    background: rgba(0,0,0,0.4); border: 1px solid var(--glass-border);
    border-radius: 12px; color: var(--text); font-family: inherit; font-size: 14px;
    outline: none; transition: all 0.3s;
  }
  input:focus {
    border-color: rgba(124,58,237,0.6);
    box-shadow: 0 0 0 4px rgba(124,58,237,0.15);
  }

  .btn {
    width: 100%; padding: 15px; border-radius: 12px; border: none;
    font-weight: 700; font-size: 15px; cursor: pointer; font-family: inherit;
    background: linear-gradient(135deg, #7c3aed, #06b6d4); color: white;
    transition: all 0.3s; margin-top: 8px;
  }
  .btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(124,58,237,0.5); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .alert {
    padding: 12px 16px; border-radius: 12px; font-size: 13.5px;
    margin-bottom: 16px; display: none;
  }
  .alert.show { display: block; }
  .alert.error { background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3); color: #fca5a5; }
  .alert.success { background: rgba(34,197,94,0.15); border: 1px solid rgba(34,197,94,0.3); color: #86efac; }

  .footer-link {
    text-align: center; margin-top: 24px; font-size: 13.5px; color: var(--text-dim);
  }
  .footer-link a { color: #a78bfa; text-decoration: none; }
  .footer-link a:hover { text-decoration: underline; }
</style>
</head>
<body>

<div class="wrapper">
  <div class="card">
    <div class="logo">⚡ SiteObfusque</div>
    <div class="subtitle">Obfuscate your Luau scripts</div>

    <div class="tabs">
      <div class="tab active" id="tab-login">Login</div>
      <div class="tab" id="tab-register">Register</div>
    </div>

    <div class="alert" id="alert"></div>

    <!-- LOGIN FORM -->
    <form id="form-login">
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="login-username" required autocomplete="username">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="login-password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn" id="btn-login">Login</button>
    </form>

    <!-- REGISTER FORM -->
    <form id="form-register" style="display: none;">
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="register-username" required autocomplete="username">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="register-email" required autocomplete="email">
      </div>
      <div class="form-group">
        <label>Password (min 6 chars)</label>
        <input type="password" id="register-password" required minlength="6" autocomplete="new-password">
      </div>
      <button type="submit" class="btn" id="btn-register">Create Account</button>
    </form>

    <div class="footer-link">
      <a href="/">← Back to home</a>
    </div>
  </div>
</div>

<script>
  const tabLogin = document.getElementById('tab-login');
  const tabRegister = document.getElementById('tab-register');
  const formLogin = document.getElementById('form-login');
  const formRegister = document.getElementById('form-register');
  const alertEl = document.getElementById('alert');

  tabLogin.onclick = () => {
    tabLogin.classList.add('active');
    tabRegister.classList.remove('active');
    formLogin.style.display = 'block';
    formRegister.style.display = 'none';
    hideAlert();
  };

  tabRegister.onclick = () => {
    tabRegister.classList.add('active');
    tabLogin.classList.remove('active');
    formRegister.style.display = 'block';
    formLogin.style.display = 'none';
    hideAlert();
  };

  function showAlert(msg, type = 'error') {
    alertEl.textContent = msg;
    alertEl.className = 'alert show ' + type;
  }
  function hideAlert() { alertEl.className = 'alert'; }

  formLogin.onsubmit = async (e) => {
    e.preventDefault();
    const username = document.getElementById('login-username').value;
    const password = document.getElementById('login-password').value;
    document.getElementById('btn-login').disabled = true;

    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error);
      showAlert('Login successful, redirecting...', 'success');
      setTimeout(() => window.location.href = '/dashboard.html', 600);
    } catch (err) {
      showAlert(err.message);
    } finally {
      document.getElementById('btn-login').disabled = false;
    }
  };

  formRegister.onsubmit = async (e) => {
    e.preventDefault();
    const username = document.getElementById('register-username').value;
    const email = document.getElementById('register-email').value;
    const password = document.getElementById('register-password').value;
    document.getElementById('btn-register').disabled = true;

    try {
      const res = await fetch('/api/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, email, password })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error);
      showAlert('Account created! Redirecting...', 'success');
      setTimeout(() => window.location.href = '/dashboard.html', 600);
    } catch (err) {
      showAlert(err.message);
    } finally {
      document.getElementById('btn-register').disabled = false;
    }
  };

  if (location.hash === '#register') tabRegister.click();
</script>

</body>
</html>
